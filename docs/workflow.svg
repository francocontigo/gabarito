<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">gabarito workflow</title>
  <desc id="d">A client file and a YAML layout go into gabarito, which runs on DuckDB. It checks the file, sets rejected lines aside, and sends typed rows to a database, to Parquet, or back out as a fixed-width return file.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <style>
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .core { fill: #0b3d5c; }
      .h { font-size: 15px; font-weight: 600; fill: #1f2328; }
      .s { font-size: 12.5px; fill: #57606a; }
      .m { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; fill: #1f2328; }
      .w { fill: #ffffff; }
      .ws { fill: #b6d4e8; font-size: 12.5px; }
      .wm { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; fill: #ffffff; }
      .l { stroke: #57606a; stroke-width: 1.5; fill: none; }
      .tag { font-size: 11.5px; fill: #57606a; }
      .bad { fill: #fff5f5; stroke: #e5b4b4; stroke-width: 1.5; }
      .badh { font-size: 15px; font-weight: 600; fill: #8a1f1f; }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="400" rx="14" fill="#f6f8fa"/>

  <!-- inputs -->
  <rect class="card" x="28" y="56" width="216" height="118" rx="10"/>
  <text class="h" x="46" y="84">Client file</text>
  <text class="s" x="46" y="106">fixed-width, CSV, Excel, CNAB</text>
  <text class="m" x="46" y="132">020112026CARTEIRA EX…</text>
  <text class="m" x="46" y="150">1CT-0001 ANA SOUZA…</text>

  <rect class="card" x="28" y="212" width="216" height="118" rx="10"/>
  <text class="h" x="46" y="240">layout.yml</text>
  <text class="s" x="46" y="262">records, positions, types, expect</text>
  <text class="m" x="46" y="288">valor: {pos: [30, 13],</text>
  <text class="m" x="46" y="306">  type: decimal, scale: 2}</text>

  <!-- core -->
  <rect class="core" x="330" y="76" width="262" height="248" rx="12"/>
  <text class="h w" x="352" y="108">gabarito</text>
  <text class="ws" x="352" y="128">builds SQL · DuckDB runs it</text>
  <line x1="352" y1="144" x2="570" y2="144" stroke="#2f6f96" stroke-width="1"/>
  <text class="wm" x="352" y="174">check</text>
  <text class="ws" x="424" y="174">counts, sums, lengths</text>
  <text class="wm" x="352" y="204">rejects</text>
  <text class="ws" x="424" y="204">bad lines + reasons</text>
  <text class="wm" x="352" y="234">load/sql</text>
  <text class="ws" x="424" y="234">typed tables</text>
  <text class="wm" x="352" y="264">export</text>
  <text class="ws" x="424" y="264">Parquet per record</text>
  <text class="wm" x="352" y="294">write</text>
  <text class="ws" x="424" y="294">tables → fixed-width</text>

  <!-- outputs -->
  <rect class="card" x="700" y="28" width="252" height="74" rx="10"/>
  <text class="h" x="718" y="58">Database</text>
  <text class="s" x="718" y="80">Postgres, MySQL through ATTACH</text>

  <rect class="card" x="700" y="118" width="252" height="74" rx="10"/>
  <text class="h" x="718" y="148">Parquet</text>
  <text class="s" x="718" y="170">disk or S3 · any warehouse reads it</text>

  <rect class="card" x="700" y="208" width="252" height="74" rx="10"/>
  <text class="h" x="718" y="238">Return file</text>
  <text class="s" x="718" y="260">fixed-width, written from a query</text>

  <rect class="bad" x="700" y="298" width="252" height="74" rx="10"/>
  <text class="badh" x="718" y="328">Rejected lines</text>
  <text class="s" x="718" y="350">line number, reason, original text</text>

  <!-- arrows -->
  <path class="l" d="M244 115 C290 115 290 170 330 170" marker-end="url(#a)"/>
  <path class="l" d="M244 271 C290 271 290 230 330 230" marker-end="url(#a)"/>
  <path class="l" d="M592 160 C650 160 640 65 700 65" marker-end="url(#a)"/>
  <path class="l" d="M592 190 C650 190 650 155 700 155" marker-end="url(#a)"/>
  <path class="l" d="M592 230 C650 230 650 245 700 245" marker-end="url(#a)"/>
  <path class="l" d="M592 262 C650 262 640 335 700 335" marker-end="url(#a)"/>
</svg>

[project]
name = "remessa"
version = "0.2.0"
description = "YAML layouts for fixed-width, CSV and Excel files. DuckDB gives you typed tables."
license = "MIT"
readme = "README.md"
authors = [
    { name = "Ricardo Franco", email = "ricardoaugustofranco@hotmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
remessa = "remessa.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project]
name = "gabarito"
version = "0.2.0"
description = "YAML layouts for fixed-width, CSV and Excel files. DuckDB gives you typed tables."
license = "MIT"
keywords = ["fixed-width", "cnab", "duckdb", "etl", "data-validation", "csv", "parquet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Office/Business :: Financial",
]
readme = "README.md"
authors = [
    { name = "Ricardo Franco", email = "ricardoaugustofranco@hotmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5.6",
    "pyyaml>=6.0.3",
]

[project.urls]
Repository = "https://github.com/francocontigo/gabarito"
Issues = "https://github.com/francocontigo/gabarito/issues"
Changelog = "https://github.com/francocontigo/gabarito/blob/main/CHANGELOG.md"

[project.scripts]
gabarito = "gabarito.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"examples/*" = ["ANN"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "dbt.*"
ignore_missing_imports = true

[tool.coverage.run]
omit = ["src/gabarito/dbt.py"]  # needs dbt-duckdb: tested by the dbt job in CI

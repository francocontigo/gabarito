# CNAB 240, bank collection (cobranca). Positions from the FEBRABAN standard layout, 240 positions, version 10.1.
# Banks change details (convenio, nosso numero): copy this file and adjust.
# Segments other than P, Q, R, T and U show up in check as lines that match no record.
source: fixed
encoding: latin-1
records:
  header_arquivo:
    match: '^.{7}0'
    length: 240
    fields:
      banco: {pos: [1, 3]}
      lote: {pos: [4, 4]}
      tipo_registro: {pos: [8, 1]}
      tipo_inscricao: {pos: [18, 1]}
      numero_inscricao: {pos: [19, 14]}
      convenio: {pos: [33, 20]}
      agencia: {pos: [53, 5]}
      agencia_dv: {pos: [58, 1]}
      conta: {pos: [59, 12]}
      conta_dv: {pos: [71, 1]}
      agencia_conta_dv: {pos: [72, 1]}
      nome_empresa: {pos: [73, 30]}
      nome_banco: {pos: [103, 30]}
      codigo_remessa_retorno: {pos: [143, 1]}
      data_geracao: {pos: [144, 8], type: date, format: '%d%m%Y'}
      hora_geracao: {pos: [152, 6]}
      sequencial_arquivo: {pos: [158, 6], type: int}

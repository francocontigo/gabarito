# CNAB 400 Itaú, cobrança, retorno. Positions from "Cobrança Bancária - Intercâmbio Eletrônico de Arquivos - Layout de Arquivos - CNAB 400" (Itaú), edição JANEIRO 2017, https://download.itau.com.br/bankline/layout_cobranca_400bytes_cnab_itau.pdf (seção 3.2 Arquivo Retorno).
# Cross-check: brcobranca retorno/cnab400/itau.rb (só detalhe).
# Outros tipos de registro possíveis no retorno (não transcritos): 4 rateio de crédito (opcional).
# ATENÇÃO: o registro opcional de cheque devolvido/compensado também começa com '1' (ocorrência 69 ou 76 em 109-110)
# e tem layout próprio a partir da posição 176; não está transcrito aqui e casa com o match do detalhe.
# Fillers omitidos: header 31-32 (zeros), 39-46, 120-394 (brancos); detalhe 22-23 (zeros), 30-37, 71-82, 95-107, 135-146,
# 189-214, 294-295, 306-311 (brancos), 312-324 (zeros), 355-377, 386-392 (brancos); trailer 8-17, 48-57, 88-177, 235-394 (brancos).
source: fixed
encoding: latin-1
records:
  header:
    match: '^02'
    length: 400
    fields:
      tipo_registro: {pos: [1, 1], value: '0'}
      codigo_retorno: {pos: [2, 1], value: '2'}
      literal_retorno: {pos: [3, 7], value: 'RETORNO'}
      codigo_servico: {pos: [10, 2], value: '01'}
      literal_servico: {pos: [12, 15], value: 'COBRANCA'}
      agencia: {pos: [27, 4]}
      conta: {pos: [33, 5]}
      dac: {pos: [38, 1]}
      nome_empresa: {pos: [47, 30]}
      codigo_banco: {pos: [77, 3], value: '341'}
      nome_banco: {pos: [80, 15]}                        # manual: 'BANCO ITAU SA'; a amostra pública traz 'BANCO ITAU S.A.', por isso sem value
      data_geracao: {pos: [95, 6], type: date, format: '%d%m%y'}
      densidade: {pos: [101, 5]}
      unidade_densidade: {pos: [106, 3], value: 'BPI'}
      sequencial_arquivo_retorno: {pos: [109, 5], type: int}
      data_credito: {pos: [114, 6], type: date, format: '%d%m%y'}
      sequencial: {pos: [395, 6], type: int}
  detalhe:
    match: '^1'
    length: 400
    fields:
      tipo_registro: {pos: [1, 1], value: '1'}
      codigo_inscricao_empresa: {pos: [2, 2]}
      numero_inscricao_empresa: {pos: [4, 14]}
      agencia: {pos: [18, 4]}
      conta: {pos: [24, 5]}
      dac: {pos: [29, 1]}
      uso_empresa: {pos: [38, 25]}
      nosso_numero: {pos: [63, 8]}
      numero_carteira: {pos: [83, 3]}
      nosso_numero_2: {pos: [86, 8]}
      dac_nosso_numero: {pos: [94, 1]}
      codigo_carteira: {pos: [108, 1]}
      codigo_ocorrencia: {pos: [109, 2]}
      data_ocorrencia: {pos: [111, 6], type: date, format: '%d%m%y'}
      numero_documento: {pos: [117, 10]}
      nosso_numero_confirmacao: {pos: [127, 8]}
      data_vencimento: {pos: [147, 6], type: date, format: '%d%m%y'}   # vem 000000 em boa parte das linhas da amostra
      valor_titulo: {pos: [153, 13], type: decimal, scale: 2}
      codigo_banco: {pos: [166, 3]}
      agencia_cobradora: {pos: [169, 4]}
      dac_agencia_cobradora: {pos: [173, 1]}
      especie: {pos: [174, 2]}
      tarifa_cobranca: {pos: [176, 13], type: decimal, scale: 2}
      valor_iof: {pos: [215, 13], type: decimal, scale: 2}
      valor_abatimento: {pos: [228, 13], type: decimal, scale: 2}
      valor_descontos: {pos: [241, 13], type: decimal, scale: 2}
      valor_principal: {pos: [254, 13], type: decimal, scale: 2}
      juros_mora_multa: {pos: [267, 13], type: decimal, scale: 2}
      outros_creditos: {pos: [280, 13], type: decimal, scale: 2}
      boleto_dda: {pos: [293, 1]}
      data_credito: {pos: [296, 6], type: date, format: '%d%m%y'}   # picture X(06): brancos quando não há crédito
      instrucao_cancelada: {pos: [302, 4]}
      nome_pagador: {pos: [325, 30]}
      erros_mensagem_informativa: {pos: [378, 8]}
      codigo_liquidacao: {pos: [393, 2]}
      sequencial: {pos: [395, 6], type: int}
  trailer:
    match: '^92'
    length: 400
    fields:
      tipo_registro: {pos: [1, 1], value: '9'}
      codigo_retorno: {pos: [2, 1], value: '2'}
      codigo_servico: {pos: [3, 2], value: '01'}
      codigo_banco: {pos: [5, 3], value: '341'}
      quantidade_titulos_simples: {pos: [18, 8], type: int}
      valor_total_simples: {pos: [26, 14], type: decimal, scale: 2}
      aviso_bancario_simples: {pos: [40, 8]}
      quantidade_titulos_vinculada: {pos: [58, 8], type: int}
      valor_total_vinculada: {pos: [66, 14], type: decimal, scale: 2}
      aviso_bancario_vinculada: {pos: [80, 8]}
      quantidade_titulos_direta_escritural: {pos: [178, 8], type: int}
      valor_total_direta_escritural: {pos: [186, 14], type: decimal, scale: 2}
      aviso_bancario_direta_escritural: {pos: [200, 8]}
      controle_arquivo: {pos: [208, 5], type: int}       # número sequencial do arquivo retorno
      quantidade_detalhes: {pos: [213, 8], type: int}
      valor_total_informado: {pos: [221, 14], type: decimal, scale: 2}
      sequencial: {pos: [395, 6], type: int}
